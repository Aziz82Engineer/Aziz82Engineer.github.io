<h3 style="margin: 0; font-size: 26px; line-height: 1.2">Three offices, one Security Fabric</h3>
<p style="margin: 0; color: #4A5A70">A FortiGate per office with Beirut as an HA pair and Fabric root, managed FortiSwitches and Wi-Fi 7 FortiAPs, and cloud-hosted management, logging and endpoint control. Every FortiGate config is generated from one inventory file.</p>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px">

<li style="display: flex; gap: 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 20px; margin-top: 2px; color: {{accent}}"><circle cx="12" cy="12" r="9"></circle><path d="M8.500 12l2.500 2.500 4.500-5"></path></svg><span><strong>Zero-trust remote access:</strong> IKEv2 IPsec with FortiClient, AD sign-in over LDAPS plus FortiToken MFA, and only EMS-compliant laptops can connect.</span></li>
<li style="display: flex; gap: 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 20px; margin-top: 2px; color: {{accent}}"><circle cx="12" cy="12" r="9"></circle><path d="M8.500 12l2.500 2.500 4.500-5"></path></svg><span><strong>10 segments per office</strong> (staff, developers, servers, voice, Wi-Fi, guest, test devices, IoT, cameras, management) with the same VLAN IDs everywhere and one /16 per office.</span></li>
<li style="display: flex; gap: 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 20px; margin-top: 2px; color: {{accent}}"><circle cx="12" cy="12" r="9"></circle><path d="M8.500 12l2.500 2.500 4.500-5"></path></svg><span><strong>Cloud management:</strong> FortiManager, FortiAnalyzer, FortiClient EMS and FortiIdentity Cloud, so no management servers in any office. Target firmware FortiOS 7.6.7.</span></li>
</ul>

function lookup(path, scope) {
  path = path.trim();
  if (path === 'true') return true;
  if (path === 'false') return false;
  if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
  let v = scope;
  for (const k of path.split('.')) { if (v == null) return undefined; v = v[k]; }

}
function interp(str, scope) {
  return str.replace(/\{\{([^}]+)\}\}/g, (_, p) => { const v = lookup(p, scope); return v == null ? '' : String(v); });
}
function whole(str) { const m = /^\s*\{\{([^}]+)\}\}\s*$/.exec(str); return m ? m[1] : null; }

function processNode(node, scope, out) {
  if (node.nodeType === Node.TEXT_NODE) { out.appendChild(document.createTextNode(interp(node.nodeValue, scope))); return; }
  if (node.nodeType !== Node.ELEMENT_NODE) return;

  if (tag === 'sc-if') {
    if (lookup(whole(node.getAttribute('value')) || 'false', scope)) node.childNodes.forEach(c => processNode(c, scope, out));
    return;

  if (tag === 'sc-for') {
    const list = lookup(whole(node.getAttribute('list')) || '', scope) || [];
    const as = node.getAttribute('as') || 'item';
    list.forEach((item, i) => {
      const child = Object.assign(Object.create(scope), { [as]: item, $index: i });
      node.childNodes.forEach(c => processNode(c, child, out));
    });
    return;
  }
  const el = node.namespaceURI === 'http://www.w3.org/2000/svg'
    ? document.createElementNS(node.namespaceURI, node.localName)
    : document.createElement(node.localName);
  for (const a of Array.from(node.attributes)) {
    if (a.name.startsWith('hint-')) continue;
    if (a.name.startsWith('on')) {
      const fn = lookup(whole(a.value) || '', scope);
      if (typeof fn === 'function') el.addEventListener(a.name.slice(2), fn);
      continue;
    }
    el.setAttribute(a.name, interp(a.value, scope));
  }
  const kids = node.localName === 'template' ? node.content.childNodes : node.childNodes;
  kids.forEach(c => processNode(c, scope, el));
  out.appendChild(el);
}

function render() {
  const scope = comp.renderVals();
  const frag = document.createDocumentFragment();
  tpl.content.childNodes.forEach(c => processNode(c, scope, frag));
  mount.replaceChildren(frag);
}
